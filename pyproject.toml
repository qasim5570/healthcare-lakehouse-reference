[project]
name = "healthcare-lakehouse-reference"
version = "0.1.0"
description = "a six-clinic healthcare provider data platform on Databricks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lakehouse*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
