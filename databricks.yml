bundle:
  name: healthcare-lakehouse-reference

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog that this target writes to.
  landing_schema:
    description: Schema that owns the landing volume.
    default: landing
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  ops_schema:
    default: ops
  notification_email:
    description: Address that receives job failure alerts.
    default: ""

targets:
  # Your personal workspace. Everything is prefixed [dev <you>] and schedules
  # are paused, so nothing fires on a timer while you are experimenting.
  dev:
    mode: development
    default: true
    variables:
      catalog: clinic_dev
    workspace:
      host: https://<workspace-host>/

  # Production. Filled in once their workspace exists.
  prod:
    mode: production
    variables:
      catalog: clinic_prod
    workspace:
      host: https://CHANGE-ME-PROD.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: sp-clinic-prod
    permissions:
      - level: CAN_MANAGE
        group_name: clinic_engineers
